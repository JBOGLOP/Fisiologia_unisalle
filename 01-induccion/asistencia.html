<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asistencia · Clase 1 — Fisiopatología General</title>
<style>
  :root{
    --ink:#12212b; --paper:#f4f7f7; --surface:#ffffff; --surface-2:#eaf0f0;
    --line:#cbd8da; --muted:#516268;
    --fisio:#10505e; --fisio-soft:#dceaec;
    --pato:#a8412c; --pato-soft:#f5e2dc;
    --shadow:0 1px 2px rgba(18,33,43,.06), 0 12px 30px -18px rgba(18,33,43,.4);
    --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ink:#e2ebea; --paper:#0d1518; --surface:#141f23; --surface-2:#1b282d;
      --line:#2c3d43; --muted:#9bafb4;
      --fisio:#5cb6c6; --fisio-soft:#12313a;
      --pato:#e08a70; --pato-soft:#3a2119;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -20px rgba(0,0,0,.9);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--body);
    line-height:1.55; -webkit-font-smoothing:antialiased;
    min-height:100dvh; display:flex; align-items:flex-start; justify-content:center;
    padding:clamp(1rem,4vw,2.5rem);
  }
  .card{
    width:100%; max-width:440px; background:var(--surface);
    border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
    padding:clamp(1.3rem,5vw,2rem); margin-top:clamp(1rem,6vh,4rem);
  }
  .eyebrow{
    font-family:var(--mono); font-size:.66rem; letter-spacing:.16em;
    text-transform:uppercase; color:var(--muted); margin:0;
  }
  h1{
    font-family:var(--display); font-weight:600; line-height:1.15;
    font-size:clamp(1.5rem,6vw,2rem); margin:.4rem 0 .2rem; text-wrap:balance;
  }
  .sub{color:var(--muted); font-size:.92rem; margin:0 0 1.4rem}
  label{display:block; font-size:.82rem; font-weight:600; margin:0 0 .35rem}
  .field{margin-bottom:1rem}
  input{
    width:100%; font:inherit; font-size:1rem; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:.75rem .85rem; -webkit-appearance:none; appearance:none;
  }
  input:focus{outline:2px solid var(--fisio); outline-offset:1px; border-color:var(--fisio)}
  .btn{
    width:100%; font:inherit; font-weight:600; font-size:1rem; cursor:pointer;
    background:var(--fisio); color:#fff; border:0; border-radius:99px;
    padding:.85rem 1rem; margin-top:.4rem; transition:filter .15s;
  }
  .btn:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.55; cursor:progress}
  .msg{
    margin-top:1rem; padding:.85rem 1rem; border-radius:10px;
    font-size:.9rem; display:none;
  }
  .msg.ok{display:block; background:var(--fisio-soft);
    border:1px solid color-mix(in srgb,var(--fisio) 35%,transparent); color:var(--fisio)}
  .msg.err{display:block; background:var(--pato-soft);
    border:1px solid color-mix(in srgb,var(--pato) 35%,transparent); color:var(--pato)}
  .meta{
    margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--line);
    font-family:var(--mono); font-size:.68rem; letter-spacing:.05em;
    color:var(--muted); display:flex; justify-content:space-between; gap:.5rem; flex-wrap:wrap;
  }
  .done{display:none; text-align:center}
  .done h2{font-family:var(--display); font-weight:600; font-size:1.5rem; margin:.2rem 0 .3rem}
  .done .tick{
    width:56px; height:56px; margin:0 auto .6rem; border-radius:50%;
    background:var(--fisio-soft); color:var(--fisio); display:grid; place-items:center;
    font-size:1.8rem;
  }
  .link{
    display:inline-block; margin-top:1.1rem; background:none; border:0; cursor:pointer;
    color:var(--fisio); font:inherit; font-size:.9rem; text-decoration:underline;
  }
</style>
</head>
<body>
  <main class="card">
    <div id="formView">
      <p class="eyebrow">Fisiopatología General · 01008430</p>
      <h1>Registro de asistencia</h1>
      <p class="sub">Clase 1 — Inducción · Escribe tus datos y toca <strong>Registrar</strong>. Solo una vez.</p>

      <form id="form" autocomplete="on">
        <div class="field">
          <label for="nombre">Nombre completo</label>
          <input id="nombre" name="nombre" type="text" required
                 autocomplete="name" autocapitalize="words"
                 placeholder="Nombres y apellidos">
        </div>
        <div class="field">
          <label for="codigo">Código estudiantil</label>
          <input id="codigo" name="codigo" type="text" required
                 inputmode="numeric" autocomplete="off"
                 placeholder="Ej. 00123456">
        </div>
        <button class="btn" id="submitBtn" type="submit">Registrar asistencia</button>
      </form>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>

      <div class="meta">
        <span id="fecha">—</span>
        <span>Universidad de La Salle</span>
      </div>
    </div>

    <div class="done" id="doneView">
      <div class="tick" aria-hidden="true">✓</div>
      <p class="eyebrow">Asistencia registrada</p>
      <h2 id="doneName">¡Listo!</h2>
      <p class="sub" id="doneDetail" style="margin-bottom:0">Ya quedaste en la lista de hoy.</p>
      <button class="link" id="againBtn" type="button">Registrar a otra persona</button>
    </div>
  </main>

  <!-- destino oculto del envío: evita problemas de CORS con Apps Script -->
  <iframe name="sink" id="sink" style="display:none" title="sink"></iframe>

<script>
(function(){
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbx34qkI1QeOQFhdvfY2-doO_HQo9LqZfAminriDBBJbHjuc9E8wAkopD4ziGj5balChxw/exec";

  var form = document.getElementById('form');
  var nombre = document.getElementById('nombre');
  var codigo = document.getElementById('codigo');
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msg');
  var sink = document.getElementById('sink');
  var formView = document.getElementById('formView');
  var doneView = document.getElementById('doneView');
  var doneName = document.getElementById('doneName');

  // Fecha visible (zona del dispositivo)
  try{
    var f = new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
    document.getElementById('fecha').textContent = f.charAt(0).toUpperCase()+f.slice(1);
  }catch(e){}

  var sending = false;
  var timer = null;

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    if(sending) return;
    var n = nombre.value.trim(), c = codigo.value.trim();
    if(n.length < 3){ showErr('Escribe tu nombre completo.'); nombre.focus(); return; }
    if(c.length < 3){ showErr('Escribe tu código estudiantil.'); codigo.focus(); return; }

    sending = true;
    btn.disabled = true; btn.textContent = 'Enviando…';
    msg.className = 'msg';

    // Envío por formulario oculto (POST hacia el iframe). Robusto y sin CORS.
    var f2 = document.createElement('form');
    f2.method = 'POST'; f2.action = ENDPOINT; f2.target = 'sink';
    f2.acceptCharset = 'utf-8';
    add(f2,'nombre', n); add(f2,'codigo', c);
    add(f2,'clase', 'Clase 1 — Inducción');
    add(f2,'tz', Intl.DateTimeFormat().resolvedOptions().timeZone || '');
    document.body.appendChild(f2);
    f2.submit();
    document.body.removeChild(f2);

    // Confirmamos cuando el iframe termina de cargar la respuesta.
    onceLoad = function(){ success(n); };
    // Red de seguridad por si el navegador no dispara load (raro).
    timer = setTimeout(function(){ success(n); }, 4000);
  });

  var onceLoad = null;
  sink.addEventListener('load', function(){
    // Ignora la carga inicial vacía del iframe.
    if(onceLoad){ var cb = onceLoad; onceLoad = null; if(timer) clearTimeout(timer); cb(); }
  });

  function success(n){
    if(!sending) return;
    sending = false;
    btn.disabled = false; btn.textContent = 'Registrar asistencia';
    var first = n.split(/\s+/)[0];
    doneName.textContent = '¡Gracias, ' + first + '!';
    formView.style.display = 'none';
    doneView.style.display = 'block';
  }

  function showErr(t){ msg.className = 'msg err'; msg.textContent = t; }

  function add(f, k, v){
    var i = document.createElement('input');
    i.type='hidden'; i.name=k; i.value=v; f.appendChild(i);
  }

  document.getElementById('againBtn').addEventListener('click', function(){
    form.reset();
    doneView.style.display = 'none';
    formView.style.display = 'block';
    nombre.focus();
  });
})();
</script>
</body>
</html>
